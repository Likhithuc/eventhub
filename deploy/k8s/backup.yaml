# Daily PostgreSQL backup: pg_dump at 02:30 UTC into its own volume, keeping the last 7 dumps.
# Restore instructions: deploy/README.md. For off-machine safety, copy dumps to S3 (see README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: eventhub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: eventhub
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 70
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: eventhub-secrets, key: DB_PASSWORD }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  file=/backups/eventhub-$(date -u +%Y%m%d-%H%M%S).dump
                  pg_dump -h postgres -U eventhub -d eventhub -Fc -f "$file"
                  echo "backup written: $file ($(du -h "$file" | cut -f1))"
                  ls -1t /backups/eventhub-*.dump | tail -n +8 | xargs -r rm -f
                  echo "kept: $(ls /backups | wc -l) backups"
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
