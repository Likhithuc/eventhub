# Local development infrastructure.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: eventhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - eventhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher: the backend sends booking emails here; read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: eventhub-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  eventhub-pgdata:
